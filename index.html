<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-BANK | HOME</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <p id="notification" hidden></p>
    <main>
        <header>
            <p class="logo"><i class="fa-solid fa-money-bill-transfer"></i> H-BANK</p>
        </header>
        <section class="hero">
            <div class="account-setup">
                <h1>WELCOME</h1>
                <p>Create your simulated account</p>
                <form action="" class="create-user" id="create-account-form">
                    <div class="user-details">
                        <label for="user"> ENTER YOUR NAME</label>
                        <input type="text" name="user" id="user" placeholder="Enter your name">
                    </div>
                    <button type="submit">CREATE ACCOUNT</button>
                </form>
            </div>

            <div class="dashboard" hidden>
                <h2>Welcome <span id="account-holder"></span></h2>
                <div class="account-details">
                    <p>
                        Account Number: 
                        <span id="account-number"></span>
                    </p>
                    <p>
                        Sort Code: 
                        <span id="sort-code"></span>
                    </p>
                    <p class="balance" id="account-balance"></p>
                </div>

                <section class="transactions">
                    <div class="transaction">
                        <button type="button" id="deposit-toggle" aria-expanded="false" aria-controls="deposit-form">DEPOSIT</button>
                        <form class="transaction-form" id="deposit-form">
                            <div class="user-details">
                                <label for="deposit-amount">Enter the amount you'd like to deposit</label>
                                <input type="number" step="0.01" min="0.01" name="amount" id="deposit-amount" placeholder="Deposit amount">
                            </div>
                            <button type="submit">DEPOSIT</button>
                        </form>
                    </div>
                    <div class="transaction">
                        <button type="button" id="withdraw-toggle" aria-expanded="false" aria-controls="withdraw-form">WITHDRAW</button>
                        <form id="withdraw-form" class="transaction-form">
                            <div class="user-details">
                                <label for="withdraw-amount">Enter the amount you'd like to withdraw</label>
                                <input type="number" step="0.01" min="0.01" name="amount" id="withdraw-amount" placeholder="Withdraw amount">
                            </div>
                            <button type="submit">WITHDRAW</button>
                        </form>
                    </div>
                </section>
                <section class="transaction-history">
                        <h3>TRANSACTION HISTORY</h3>
                        <ul id="transaction-list">
                            
                        </ul>
                </section>
                <button type="button" id="reset-account">RESET ACCOUNT</button>
            </div>
        </section>
    </main>
    <script type="module" src="js/index.js"></script>
</body>
</html>
